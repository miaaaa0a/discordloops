name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Format latest commit date
      id: commitdate
      run: echo "::set-output name=date::$(${{ github.event.repository.updated_at}} | sed 's/:/./g')"
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: discordloops-${{ steps.commitdate.outputs.date }}
        path: |
          target/debug/fl-rpc.exe
          config.json
          icon.ico
    
