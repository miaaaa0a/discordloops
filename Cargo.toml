[package]
name = "fl-rpc"
version = "0.5.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
discord-sdk = "0.4.0"
eframe = "0.32.3"
egui_extras = { version = "0.32.3", features = ["image"] }
ftail = "0.2.1"
image = { version = "0.25.8", features = ["png"] }
log = "0.4.27"
serde = "1.0.219"
serde_json = "1.0.140"
thiserror = "2.0.16"
tokio = { version = "1.44.1", features = ["full"] }
widestring = "1.2.0"
winit = "0.30.12"

[dependencies.windows]
version = "0.61.1"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading"
]

[build-dependencies]
embed-resource = "3.0.2"
